services:
  - type: web
    name: cyclesense-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
    healthCheckPath: /health
    healthCheckTimeout: 30
    healthCheckInterval: 15
    autoDeploy: true
    numInstances: 1
