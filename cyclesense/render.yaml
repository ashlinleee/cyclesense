services:
  # Backend API Service
  - type: web
    name: cyclesense-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: API_URL
        value: https://cyclesense-yjca.onrender.com
    healthCheckPath: /health
    healthCheckTimeout: 30
    healthCheckInterval: 15
    autoDeploy: true
    numInstances: 1

  # Frontend Streamlit Service
  - type: web
    name: cyclesense-frontend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.streamlit
    envVars:
      - key: PORT
        value: 8501
      - key: API_URL
        value: https://cyclesense-yjca.onrender.com
    healthCheckPath: /_stcore/health
    healthCheckTimeout: 30
    healthCheckInterval: 15
    autoDeploy: true
    numInstances: 1
