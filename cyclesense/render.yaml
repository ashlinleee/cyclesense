services:
  - type: web
    name: cyclesense-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 60 --timeout-graceful-shutdown 30 --workers 1
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
    healthCheckPath: /health
    healthCheckTimeout: 30
    healthCheckInterval: 15
    autoDeploy: false
    numInstances: 1
